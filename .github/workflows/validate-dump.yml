name: Validate dump

on:
  push:
  pull_request:

jobs:
  validate-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build dump
        run: npm run build:dump

      - name: Validate dump
        run: npm run validate:dump
